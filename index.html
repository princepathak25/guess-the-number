<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guess The Number</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="game-card">
            <h1>Guess The Number</h1>
            <p class="info">
                I'm thinking of a number between <strong>1</strong> and
                <strong>100</strong>.
            </p>
            <p class="info">
                You have <strong>10</strong> attempts.
            </p>
            <form class="form">
                <label for="guessField">
                    Enter your guess
                </label>
                <input
                    type="number"
                    id="guessField"
                    min="1"
                    max="100"
                    placeholder="1 - 100"
                    autocomplete="off"
                >
                <button id="subt">
                    Guess
                </button>
            </form>
            <div class="progress">
                <div class="progress-bar"></div>
            </div>
            <div class="result">
                <p>Previous Guesses:<span class="guesses"></span>
                </p>
                <p>
                    Attempts Left:<span class="lastResult">10</span>
                </p>
                <p>🏆 Best Score: <span class="bestScore">-</span></p>
                <p class="lowOrHigh"></p>
            </div>
            <button id="newGame" hidden>
                Play Again
            </button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
